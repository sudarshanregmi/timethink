[pytest]
# Discover tests everywhere under project root — any new test_*.py or test.py
# is automatically picked up regardless of where it lives.
pythonpath = .
testpaths = .
python_files = test_*.py test.py
python_classes = Test*
python_functions = test_*

# Skip heavy directories that don't contain tests
norecursedirs = .git __pycache__ env .venv node_modules data think_data verl docs scripts

# Show short test summary on failure
addopts = --tb=short -q
